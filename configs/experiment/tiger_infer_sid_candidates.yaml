# @package _global_

data_dir: ???
semantic_id_path: ???
ckpt_path: ???
num_hierarchies: ???
num_embeddings_per_hierarchy: ???
sequence_length: 32
hist_itemkey_length: 100
predict_split: testing
candidate_output_subdir: ${predict_split}_candidate_cache
seed: 42

task_name: inference
id: ${now:%Y-%m-%d}/${now:%H-%M-%S}
tags:
  - tiger-sid-candidates

paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  enforce_tags: true
  print_config_warnings: true
  print_config: true

data_loading:
  features_config:
    features:
      - name: sequence_data
        num_placeholder_tokens: 0
        semantic_ids: ???
        type:
          _target_: torch.__dict__.get
          _args_: [int32]
      - name: user_id
        type:
          _target_: torch.__dict__.get
          _args_: [int64]

  predict_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/${predict_split}
      should_shuffle_rows: false
      labels: {}
      batch_size_per_device: 32
      num_workers: 8
      timeout: 0
      assign_files_by_size: true
      oov_token: null
      masking_token: -1
      sequence_length: ${sequence_length}
      padding_token: 0
      drop_last: false
      persistent_workers: false
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_fn_train
        _partial_: true
        sequence_length: ${data_loading.predict_dataloader_config.dataloader.sequence_length}
        hist_itemkey_length: ${hist_itemkey_length}
        padding_token: ${data_loading.predict_dataloader_config.dataloader.padding_token}
      dataset_config:
        _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
        user_id_field: user_id
        min_sequence_length: 1
        iterate_per_row: true
        keep_user_id: true
        features_to_consider: "${extract_fields_from_list_of_dicts:${data_loading.features_config.features},name,False}"
        num_placeholder_tokens_map: "${create_map_from_list_of_dicts:${data_loading.features_config.features},name,num_placeholder_tokens}"
        semantic_id_map:
          _target_: numpy.load
          _args_:
            - ${semantic_id_path}
          mmap_mode: r
          allow_pickle: false
        data_iterator:
          _target_: src.data.loading.components.iterators.TFRecordIterator
        preprocessing_functions:
          - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
            _partial_: true
            features_to_apply: [sequence_data]
        num_hierarchies: ${num_hierarchies}
        num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
      pin_memory: false

  datamodule:
    _target_: src.data.loading.datamodules.sequence_datamodule.SequenceDataModule
    predict_dataloader_config: ${..predict_dataloader_config.dataloader}

model:
  _target_: src.models.modules.semantic_id.tiger_generation_model.SemanticIDEncoderDecoder
  huggingface_model: null
  feature_to_model_input_map:
    sequence_data: input_ids
  postprocessor: null
  aggregator: null
  loss_function: ${loss.loss_function}
  optimizer: null
  scheduler: null
  evaluator: null
  weight_tying: true
  compile: false
  decoder:
    _target_: transformers.models.llama.modeling_llama.LlamaModel
    config:
      _target_: transformers.models.llama.configuration_llama.LlamaConfig
      vocab_size: 256
      hidden_size: 1024
      intermediate_size: 4096
      num_hidden_layers: 2
      num_attention_heads: 16
      rms_norm_eps: 1e-6
  num_hierarchies: ${num_hierarchies}
  num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
  num_user_bins: null
  training_task: sid
  load_only_weights: false
  codebooks: ${data_loading.predict_dataloader_config.dataloader.dataset_config.semantic_id_map}
  padding_token: ${data_loading.predict_dataloader_config.dataloader.padding_token}
  masking_token: ${data_loading.predict_dataloader_config.dataloader.masking_token}
  top_k_for_generation: 20
  top_k_for_score: 10

loss:
  loss_function:
    sid_loss:
      _target_: torch.nn.CrossEntropyLoss
      ignore_index: -1
    click_loss:
      _target_: torch.nn.BCEWithLogitsLoss

callbacks:
  bq_writer: null
  tensor_shard_writer:
    _target_: src.utils.inference_utils.LocalTensorShardWriter
    output_dir: ${paths.output_dir}/${candidate_output_subdir}
    num_candidates: ${model.top_k_for_generation}
    num_hierarchies: ${num_hierarchies}
    hist_itemkey_length: ${hist_itemkey_length}
    pad_itemkey_value: -1
    pad_sid_value: 0
    flush_frequency: 10000
    write_interval: batch

logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv
    version: ''
    prefix: ''

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  accelerator: gpu
  devices: -1
  num_nodes: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  deterministic: false
  accumulate_grad_batches: 1
  profiler:
    _target_: lightning.pytorch.profilers.PassThroughProfiler
  strategy: ddp
  sync_batchnorm: true
  enable_checkpointing: false
  enable_model_summary: true
