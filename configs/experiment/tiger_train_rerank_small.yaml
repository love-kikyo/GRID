# @package _global_

candidate_manifest_path: ???
train_candidate_cache_paths: ${manifest_value:${candidate_manifest_path},splits.train.shard_paths}
train_candidate_cache_lengths: ${manifest_value:${candidate_manifest_path},splits.train.shard_lengths}
val_candidate_cache_paths: ${manifest_value:${candidate_manifest_path},splits.val.shard_paths}
val_candidate_cache_lengths: ${manifest_value:${candidate_manifest_path},splits.val.shard_lengths}
test_candidate_cache_paths: ${manifest_value:${candidate_manifest_path},splits.test.shard_paths}
test_candidate_cache_lengths: ${manifest_value:${candidate_manifest_path},splits.test.shard_lengths}
num_candidates: ${manifest_value:${candidate_manifest_path},num_candidates}
num_hierarchies: ${manifest_value:${candidate_manifest_path},num_hierarchies}
num_embeddings_per_hierarchy: ${manifest_value:${candidate_manifest_path},num_embeddings_per_hierarchy}
num_item_buckets: 300000
hist_itemkey_length: 100
pad_itemkey_value: -1
pad_sid_value: 0

task_name: train
id: ${now:%Y-%m-%d}/${now:%H-%M-%S}
tags:
  - tiger-rerank-small

train: true
test: true
ckpt_path: null
seed: 42

paths:
  root_dir: .
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  enforce_tags: true
  print_config_warnings: true
  print_config: true

data_loading:
  train_dataloader_config:
    _target_: src.data.loading.components.interfaces.RerankCandidateDataloaderConfig
    dataset_class:
      _target_: src.data.loading.components.rerank_candidate_dataset.RerankCandidateDataset
    dataset_config:
      _target_: src.data.loading.components.interfaces.RerankCandidateDatasetConfig
      candidate_cache_paths: ${train_candidate_cache_paths}
      candidate_cache_lengths: ${train_candidate_cache_lengths}
      num_candidates: ${num_candidates}
      num_hierarchies: ${num_hierarchies}
      hist_itemkey_length: ${hist_itemkey_length}
      pad_itemkey_value: ${pad_itemkey_value}
      pad_sid_value: ${pad_sid_value}
    batch_size_per_device: 128
    num_workers: 4
    collate_fn:
      _target_: src.data.loading.components.collate_functions.collate_fn_rerank_candidates
      _partial_: true
      num_candidates: ${num_candidates}
      num_hierarchies: ${num_hierarchies}
      hist_itemkey_length: ${hist_itemkey_length}
      pad_itemkey_value: ${pad_itemkey_value}
      pad_sid_value: ${pad_sid_value}
    drop_last: false
    pin_memory: true
    persistent_workers: true
    timeout: 0

  val_dataloader_config:
    _target_: src.data.loading.components.interfaces.RerankCandidateDataloaderConfig
    dataset_class: ${data_loading.train_dataloader_config.dataset_class}
    dataset_config:
      _target_: src.data.loading.components.interfaces.RerankCandidateDatasetConfig
      candidate_cache_paths: ${val_candidate_cache_paths}
      candidate_cache_lengths: ${val_candidate_cache_lengths}
      num_candidates: ${num_candidates}
      num_hierarchies: ${num_hierarchies}
      hist_itemkey_length: ${hist_itemkey_length}
      pad_itemkey_value: ${pad_itemkey_value}
      pad_sid_value: ${pad_sid_value}
    batch_size_per_device: ${data_loading.train_dataloader_config.batch_size_per_device}
    num_workers: ${data_loading.train_dataloader_config.num_workers}
    collate_fn: ${data_loading.train_dataloader_config.collate_fn}
    drop_last: false
    pin_memory: true
    persistent_workers: true
    timeout: 0

  test_dataloader_config:
    _target_: src.data.loading.components.interfaces.RerankCandidateDataloaderConfig
    dataset_class: ${data_loading.train_dataloader_config.dataset_class}
    dataset_config:
      _target_: src.data.loading.components.interfaces.RerankCandidateDatasetConfig
      candidate_cache_paths: ${test_candidate_cache_paths}
      candidate_cache_lengths: ${test_candidate_cache_lengths}
      num_candidates: ${num_candidates}
      num_hierarchies: ${num_hierarchies}
      hist_itemkey_length: ${hist_itemkey_length}
      pad_itemkey_value: ${pad_itemkey_value}
      pad_sid_value: ${pad_sid_value}
    batch_size_per_device: ${data_loading.train_dataloader_config.batch_size_per_device}
    num_workers: ${data_loading.train_dataloader_config.num_workers}
    collate_fn: ${data_loading.train_dataloader_config.collate_fn}
    drop_last: false
    pin_memory: true
    persistent_workers: false
    timeout: 0

  datamodule:
    _target_: src.data.loading.datamodules.rerank_candidate_datamodule.RerankCandidateDataModule
    train_dataloader_config: ${..train_dataloader_config}
    val_dataloader_config: ${..val_dataloader_config}
    test_dataloader_config: ${..test_dataloader_config}

model:
  _target_: src.models.modules.rerank.sid_rerank_small_model.SIDRerankSmallModel
  model: null
  optimizer: ${optim.optimizer}
  scheduler: ${optim.scheduler}
  loss_function: ${loss.loss_function}
  evaluator: ${eval.evaluators}
  num_hierarchies: ${num_hierarchies}
  num_candidates: ${num_candidates}
  num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
  num_item_buckets: ${num_item_buckets}
  item_embedding_dim: 128
  sid_embedding_dim: 32
  hidden_dim_list: [256, 128]
  padding_idx: ${pad_itemkey_value}
  use_beam_score: true

loss:
  loss_function:
    sid_loss:
      _target_: torch.nn.Identity
    click_loss:
      _target_: torch.nn.Identity

optim:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0005
    weight_decay: 0.0001
  scheduler:
    _target_: transformers.get_cosine_schedule_with_warmup
    _partial_: true
    num_warmup_steps: 1000
    num_training_steps: 50000

eval:
  evaluators:
    beam:
      _target_: src.components.eval_metrics.SIDRetrievalEvaluator
      top_k_list: [5, 10]
      metrics:
        ndcg:
          _target_: src.components.eval_metrics.NDCG
          _partial_: true
        recall:
          _target_: src.components.eval_metrics.Recall
          _partial_: true
    rerank:
      _target_: src.components.eval_metrics.SIDRetrievalEvaluator
      top_k_list: [5, 10]
      metrics:
        ndcg:
          _target_: src.components.eval_metrics.NDCG
          _partial_: true
        recall:
          _target_: src.components.eval_metrics.Recall
          _partial_: true

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: checkpoint_{epoch:03d}_{step:06d}
    monitor: val/recall@5
    verbose: true
    save_last: null
    save_top_k: 1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: ${callbacks.model_checkpoint.monitor}
    min_delta: 0.0
    patience: 5
    verbose: true
    mode: ${callbacks.model_checkpoint.mode}
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: false
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  restart_job:
    _target_: src.utils.restart_job.RestartAndLoadCheckpointCallback
    metadata_dir: ${paths.metadata_dir}

logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv
    version: ''
    prefix: ''
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${paths.output_dir}
    name: tb_logs
    version: ''
    sub_dir: ''

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  precision: bf16-mixed
  min_steps: 1
  max_steps: 50000
  max_epochs: null
  min_epochs: 0
  accelerator: gpu
  devices: -1
  num_nodes: 1
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  deterministic: false
  accumulate_grad_batches: 1
  profiler:
    _target_: lightning.pytorch.profilers.PassThroughProfiler
  strategy: ddp
  sync_batchnorm: true
  num_sanity_val_steps: 0
