# @package _global_

# =============================================================================
# Global Settings
# =============================================================================
data_dir: ???
semantic_id_path: ???
sorted_item_keys_path: ???
sorted_row_indices_path: ???
scl_embedding_path: ???
num_hierarchies: ???
num_embeddings_per_hierarchy: ???
sequence_length: 32

task_name: train
id: ${now:%Y-%m-%d}/${now:%H-%M-%S}
tags:
  - amazon-p5-gr-train
train: true
test: true
ckpt_path: null
seed: 42

# Training task: "sid" or "click"
training_task: sid

# =============================================================================
# Paths Configuration
# =============================================================================
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

# =============================================================================
# Extras Configuration
# =============================================================================
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config_warnings: true
  print_config: true

# =============================================================================
# Data Loading Configuration
# =============================================================================
data_loading:
  features_config:
    features:
      - name: sequence_data
        num_placeholder_tokens: 0
        semantic_ids: ???
        type:
          _target_: torch.__dict__.get
          _args_: [int32]

  train_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/training
      should_shuffle_rows: true
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${num_hierarchies}
      batch_size_per_device: 32
      num_workers: 8
      timeout: 0
      assign_files_by_size: false
      oov_token: null
      masking_token: -1
      sequence_length: ${sequence_length}
      padding_token: 0
      drop_last: true
      persistent_workers: true
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_fn_train
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      dataset_config:
        _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
        user_id_field: user_id
        min_sequence_length: 1
        iterate_per_row: true
        keep_user_id: false
        features_to_consider: "${extract_fields_from_list_of_dicts:${data_loading.features_config.features},name,False}"
        num_placeholder_tokens_map: "${create_map_from_list_of_dicts:${data_loading.features_config.features},name,num_placeholder_tokens}"
        semantic_id_map:
          _target_: numpy.load
          _args_:
            - ${semantic_id_path}
          mmap_mode: r
          allow_pickle: false
        data_iterator:
          _target_: src.data.loading.components.iterators.TFRecordIterator
        preprocessing_functions:
          - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
            _partial_: true
            features_to_apply: [sequence_data, similar_context]
        num_hierarchies: ${num_hierarchies}
        num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
      assign_all_files_per_worker: true

  val_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/evaluation
      should_shuffle_rows: false
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${num_hierarchies}
      batch_size_per_device: 32
      num_workers: 8
      timeout: 0
      assign_files_by_size: true
      oov_token: ${data_loading.train_dataloader_config.dataloader.oov_token}
      masking_token: ${data_loading.train_dataloader_config.dataloader.masking_token}
      sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
      padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      drop_last: false
      persistent_workers: true
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_fn_train
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      dataset_config:
        _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
        user_id_field: user_id
        min_sequence_length: 1
        iterate_per_row: true
        keep_user_id: false
        features_to_consider: "${extract_fields_from_list_of_dicts:${data_loading.features_config.features},name,False}"
        num_placeholder_tokens_map: "${create_map_from_list_of_dicts:${data_loading.features_config.features},name,num_placeholder_tokens}"
        semantic_id_map:
          _target_: numpy.load
          _args_:
            - ${semantic_id_path}
          mmap_mode: r
          allow_pickle: false
        data_iterator:
          _target_: src.data.loading.components.iterators.TFRecordIterator
        preprocessing_functions:
          - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
            _partial_: true
            features_to_apply: [sequence_data, similar_context]
        num_hierarchies: ${num_hierarchies}
        num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
      pin_memory: false

  test_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/testing
      should_shuffle_rows: false
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${num_hierarchies}
      batch_size_per_device: 32
      num_workers: 8
      timeout: 0
      assign_files_by_size: true
      oov_token: ${data_loading.train_dataloader_config.dataloader.oov_token}
      masking_token: ${data_loading.train_dataloader_config.dataloader.masking_token}
      sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
      padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      drop_last: false
      persistent_workers: false
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_fn_train
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      dataset_config:
        _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
        user_id_field: user_id
        min_sequence_length: 1
        iterate_per_row: true
        keep_user_id: false
        features_to_consider: "${extract_fields_from_list_of_dicts:${data_loading.features_config.features},name,False}"
        num_placeholder_tokens_map: "${create_map_from_list_of_dicts:${data_loading.features_config.features},name,num_placeholder_tokens}"
        semantic_id_map:
          _target_: numpy.load
          _args_:
            - ${semantic_id_path}
          mmap_mode: r
          allow_pickle: false
        data_iterator:
          _target_: src.data.loading.components.iterators.TFRecordIterator
        preprocessing_functions:
          - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
            _partial_: true
          - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
            _partial_: true
            features_to_apply: [sequence_data, similar_context]
        num_hierarchies: ${num_hierarchies}
        num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
      pin_memory: false

  datamodule:
    _target_: src.data.loading.datamodules.sequence_datamodule.SequenceDataModule
    train_dataloader_config: ${..train_dataloader_config.dataloader}
    val_dataloader_config: ${..val_dataloader_config.dataloader}
    test_dataloader_config: ${..test_dataloader_config.dataloader}

# =============================================================================
# Model Configuration
# =============================================================================
model:
  _target_: src.models.modules.semantic_id.tiger_generation_model.SemanticIDEncoderDecoder
  huggingface_model: null
  feature_to_model_input_map:
    sequence_data: input_ids
  postprocessor: null
  aggregator: null
  loss_function: ${loss.loss_function}
  optimizer: ${optim.optimizer}
  scheduler: ${optim.scheduler}
  evaluator: ${eval.evaluators}
  weight_tying: true
  compile: false
  decoder:
    _target_: transformers.models.llama.modeling_llama.LlamaModel
    config:
      _target_: transformers.models.llama.configuration_llama.LlamaConfig
      vocab_size: 256
      hidden_size: 1024
      intermediate_size: 4096
      num_hidden_layers: 2
      num_attention_heads: 16
      rms_norm_eps: 1e-6
  num_hierarchies: ${num_hierarchies}
  num_embeddings_per_hierarchy: ${num_embeddings_per_hierarchy}
  num_user_bins: null
  training_task: ${training_task}
  load_only_weights: false
  codebooks: ${data_loading.train_dataloader_config.dataloader.dataset_config.semantic_id_map}
  padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
  masking_token: ${data_loading.train_dataloader_config.dataloader.masking_token}
  sorted_item_keys:
    _target_: numpy.load
    _args_:
      - ${sorted_item_keys_path}
  sorted_row_indices:
    _target_: numpy.load
    _args_:
      - ${sorted_row_indices_path}
  scl_embedding_path: ${scl_embedding_path}
  top_k_for_generation: 20
  top_k_for_score: 10

# =============================================================================
# Loss Configuration
# =============================================================================
loss:
  loss_function:
    sid_loss:
      _target_: torch.nn.CrossEntropyLoss
      ignore_index: ${sub:${data_loading.train_dataloader_config.dataloader.padding_token},1}
    click_loss:
      _target_: torch.nn.BCEWithLogitsLoss

# =============================================================================
# Optimizer & Scheduler Configuration
# =============================================================================
optim:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.00001
    weight_decay: 0.0001
  scheduler:
    _target_: transformers.get_cosine_schedule_with_warmup
    _partial_: true
    num_warmup_steps: 20000
    num_training_steps: 120000

# =============================================================================
# Evaluation Configuration
# =============================================================================
eval:
  evaluators:
    beam:
      _target_: src.components.eval_metrics.SIDRetrievalEvaluator
      top_k_list: [5, 10]
      metrics:
        ndcg:
          _target_: src.components.eval_metrics.NDCG
          _partial_: true
        recall:
          _target_: src.components.eval_metrics.Recall
          _partial_: true
    rerank:
      _target_: src.components.eval_metrics.SIDRetrievalEvaluator
      top_k_list: [5, 10]
      metrics:
        ndcg:
          _target_: src.components.eval_metrics.NDCG
          _partial_: true
        recall:
          _target_: src.components.eval_metrics.Recall
          _partial_: true

# =============================================================================
# Callbacks Configuration
# =============================================================================
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: checkpoint_{epoch:03d}_{step:06d}
    monitor: val/recall@5
    verbose: true
    save_last: null
    save_top_k: 1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: ${callbacks.model_checkpoint.monitor}
    min_delta: 0.0
    patience: 5
    verbose: true
    mode: ${callbacks.model_checkpoint.mode}
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: false
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  restart_job:
    _target_: src.utils.restart_job.RestartAndLoadCheckpointCallback
    metadata_dir: ${paths.metadata_dir}

# =============================================================================
# Logger Configuration
# =============================================================================
logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${paths.output_dir}
    name: tb_logs

# =============================================================================
# Trainer Configuration
# =============================================================================
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  precision: bf16-mixed
  min_steps: 1
  max_steps: 120000
  max_epochs: null
  min_epochs: 0
  limit_train_batches: 1.0
  accelerator: gpu
  devices: -1
  num_nodes: 1
  log_every_n_steps: 5
  val_check_interval: 20000
  check_val_every_n_epoch: null
  limit_val_batches: 5000
  deterministic: false
  accumulate_grad_batches: 4
  profiler:
    _target_: lightning.pytorch.profilers.PassThroughProfiler
  strategy: ddp
  sync_batchnorm: true
  num_sanity_val_steps: 0

defaults:
  - _self_
  - optional config_override: